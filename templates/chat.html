<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czat #{{ conv_id }} - Northwind AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 flex h-screen overflow-hidden">


  <aside class="w-64 bg-gray-950 flex flex-col border-r border-gray-800">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-wide hover:text-indigo-400 transition">Northwind AI</a>
    </div>


    <div class="p-3">
      <a href="/"
        class="flex items-center gap-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg font-medium transition shadow-sm text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nowa rozmowa
      </a>
    </div>


    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
      <div class="text-xs font-semibold text-gray-500 uppercase px-3 mb-2">Aktywna rozmowa</div>
      <div class="px-3 py-2 rounded-lg text-sm bg-gray-800 text-white font-medium truncate">
        Rozmowa nr {{ conv_id }}
      </div>

    </div>
  </aside>


  <main class="flex-1 flex flex-col h-full bg-gray-900">


    <header class="h-14 border-b border-gray-800 flex items-center px-6 bg-gray-900/50 backdrop-blur">
      <span class="text-sm font-medium text-gray-400">Konwersacja #{{ conv_id }}</span>
    </header>


    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      {% if messages %}
      {% for prompt, response in messages %}

      <div class="flex items-start gap-4 max-w-3xl mx-auto w-full justify-end">
        <div class="bg-indigo-600 text-white rounded-2xl px-4 py-3 max-w-xl text-sm shadow-md">
          {{ prompt }}
        </div>
        <div class="w-8 h-8 rounded-full bg-indigo-700 flex items-center justify-center text-xs font-bold shrink-0">Ty
        </div>
      </div>


      <div class="flex items-start gap-4 max-w-3xl mx-auto w-full">
        <div
          class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold shrink-0 text-indigo-300">
          AI</div>
        <div
          class="bg-gray-800 border border-gray-700/60 text-gray-200 rounded-2xl px-5 py-4 max-w-2xl text-sm shadow-md space-y-2">
          <pre class="whitespace-pre-wrap font-sans leading-relaxed">{{ response }}</pre>
        </div>
      </div>
      {% endfor %}
      {% else %}
      <div class="text-center text-gray-500 my-auto">Ta rozmowa jest pusta. Napisz coś poniżej.</div>
      {% endif %}
    </div>


    <div class="p-4 bg-gray-900 border-t border-gray-800">
      <form action="/chat/{{ conv_id }}" method="POST" class="max-w-3xl mx-auto relative flex items-center">
        <textarea name="query" rows="1" required placeholder="Napisz wiadomość do agenta..."
          class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-4 pr-12 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none text-sm shadow-inner"></textarea>
        <button type="submit"
          class="absolute right-3 bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-lg transition shadow">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>
    </div>

  </main>

  <script>
    const form = document.querySelector('form[action^="/chat/"]');
    const textarea = form.querySelector('textarea[name="query"]');
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (textarea.value.trim() !== '') {
          form.submit();
        }
      }
    });
  </script>
</body>

</html>
